services:
  mysql:
    image: mysql:8.0
    container_name: gameflix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gameflix_auth
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: gameflix-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # The app reaches MySQL by the service name "mysql" on the compose network.
      DB_URL: "jdbc:mysql://mysql:3306/gameflix_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
