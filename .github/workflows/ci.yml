name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Build Docker image
        run: docker build -t gameflix-backend:latest .

      # ---------------------------------------------------------------------
      # Supply-chain gate. These run AFTER the image is built (you can only
      # inventory and scan what actually ships) and BEFORE any push/deploy,
      # so a CRITICAL-flagged image never leaves the pipeline.
      # ---------------------------------------------------------------------

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: gameflix-backend:latest
          format: cyclonedx-json
          output-file: gameflix-backend.sbom.cdx.json
          upload-artifact: true
          artifact-name: gameflix-backend-sbom

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Vulnerability report (Trivy - HIGH & CRITICAL, informational)
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress gameflix-backend:latest

      - name: Security gate (Trivy - FAIL the build on any CRITICAL)
        run: trivy image --severity CRITICAL --exit-code 1 --no-progress gameflix-backend:latest
