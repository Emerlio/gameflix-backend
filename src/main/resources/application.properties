spring.application.name=auth-service

# --- Datasource (MySQL) ---
# Values are supplied by the git-ignored 'local' profile (application-local.properties)
# or by environment variables. No credentials are committed in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gameflix_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# 'update' evolves the schema to match the entities without wiping existing rows
# between runs, so registered test users (and the hash screenshot) survive a restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Application settings ---
# JWT signing secret (>= 32 chars) and token lifetime; CORS limited to one origin.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXP_MINUTES:60}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}
