# Automated tests run against in-memory H2 (MySQL-compatible mode) so they need
# no live MySQL server. The application itself runs on MySQL (see application.properties).
spring.datasource.url=jdbc:h2:mem:authtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-test-only-secret-test-only-secret-123456
app.jwt.expiration-minutes=60
app.cors.allowed-origin=http://localhost:3000
